<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f8ff">
  <meta name="description" content="从智能体开发工具到云平台服务，探索 Racore 的最新产品与能力。">
  <title>Racore · 产品发布中心</title>
  <link rel="stylesheet" href="styles.css">
  <script src="embed.js" defer></script>
<style>body{min-width:0}.skip-link{display:none}@media(max-width:700px){.page{min-height:460px;padding:0}.artwork{top:0;height:450px;width:100%;clip-path:none}.release-card{top:70px;right:7%}}</style><style>@media(max-width:700px){.page{min-height:300px}.artwork{height:300px}.release-card{top:30px;right:8%}}</style></head>
<body>
  <a class="skip-link" href="#main">跳转至主要内容</a>
  <div class="viewport">
    <div class="page">
      <main id="main">
        <div class="artwork" role="img" aria-label="通透蓝色地球与玻璃环带，从新加坡向全球发散的 CDN 网络光线。"><div class="network-origin" aria-hidden="true"><span class="origin-halo"></span><span class="origin-core"></span><span class="origin-name">SINGAPORE</span></div></div>
        
        <article class="release-card" id="release" aria-labelledby="release-title" tabindex="-1">
          <div class="card-face" aria-hidden="true"></div>
          <div class="release-content">
            <div class="terminal-heading"><span class="window-dots" aria-hidden="true"><i></i><i></i><i></i></span><span>racore - launch status</span></div>
            <div class="terminal-body">
              <div class="status-intro"><p class="status-caption" data-zh="# racore 发布中心 · 状态实时同步" data-en="# racore launch center · status synced"># racore 发布中心 · 状态实时同步</p></div>
              <div class="featured-release"><h2 id="release-title">Fusion CDN</h2><span class="release-tag" data-zh="最新发布" data-en="Latest release">最新发布</span></div><dl class="status-rows">
                
                <div><dt data-zh="状态" data-en="Status">状态</dt><dd><span class="live"><i aria-hidden="true"></i>LIVE</span></dd></div>
                <div><dt data-zh="发布时间" data-en="Released">发布时间</dt><dd><time datetime="2026-10-23">2026-10-23</time></dd></div>
                <div><dt data-zh="研发中" data-en="In development">研发中</dt><dd><span data-zh="更多产品在路上" data-en="More on the way">更多产品在路上</span></dd></div>
              </dl>
              <div class="command"><code><span>$</span> racore follow --launches</code></div>
            </div>
          </div>
        </article>
      </main>
    </div>
  </div>
  <dialog id="info-dialog" aria-labelledby="dialog-title"><button class="dialog-close" type="button" aria-label="关闭">×</button><span class="dialog-kicker">RACORE</span><h2 id="dialog-title"></h2><div id="dialog-body"></div><button class="dialog-done" type="button" data-zh="知道了" data-en="Got it">知道了</button></dialog>
  <div class="toast" role="status" aria-live="polite"></div>
</body>
</html>
